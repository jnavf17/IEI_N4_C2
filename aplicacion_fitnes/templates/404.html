<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
    <title>FitApp - Página no encontrada</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; }

        .topbar {
            background-color: #0f3d2e;
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 14px;
        }

        header {
            background-color: #2ecc71;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 15px;
        }

        .btn-outline {
            border: 2px solid white;
            padding: 8px 18px;
            border-radius: 5px;
            color: white;
            text-decoration: none;
        }

        .hero {
            background-color: #4a3ef3;
            color: white;
            text-align: center;
            padding: 60px 20px 100px;
        }

        .hero h1 {
            font-size: 60px;
            margin-bottom: 10px;
        }

        .hero h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn-cta {
            background-color: #090909;
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>

    <section class="hero">
        <h1>404</h1>
        <h2>Página no encontrada</h2>
        <p>Parece que esta ruta no existe todavía.<br>
        Vuelve al inicio y sigue entrenando con FitApp.</p>

        <a href="/" class="btn-cta">Volver al Inicio</a>
    </section>

</body>
</html>
